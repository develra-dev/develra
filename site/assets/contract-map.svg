<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">External contract map</title>
  <desc id="desc">A Develra graph connecting one repository to OpenAI, Slack, and Stripe.</desc>
  <defs>
    <linearGradient id="repo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff754f"/>
      <stop offset="1" stop-color="#ff5a2c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3bd8d0" stop-opacity=".14"/>
      <stop offset="1" stop-color="#a986ff" stop-opacity=".04"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="900" height="540" fill="#0b0b0b"/>
  <circle cx="790" cy="38" r="220" fill="url(#glow)"/>
  <g fill="none" stroke="#343434" stroke-width="2">
    <path d="M340 270C410 270 428 132 500 132"/>
    <path d="M340 270H500"/>
    <path d="M340 270C410 270 428 408 500 408"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="210" width="270" height="120" rx="24" fill="url(#repo)"/>
    <text x="205" y="265" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="25" font-weight="750" text-anchor="middle">Repository</text>
    <text x="205" y="295" fill="#ffe8df" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">3 external contracts</text>
  </g>
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <g>
      <rect x="500" y="80" width="330" height="104" rx="20" fill="#141c1b" stroke="#2f7772"/>
      <circle cx="538" cy="116" r="11" fill="#3bd8d0" fill-opacity=".16" stroke="#3bd8d0"/>
      <path d="m533 116 3 3 6-7" fill="none" stroke="#3bd8d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="564" y="122" fill="#fff" font-size="19" font-weight="700">OpenAI</text>
      <text x="538" y="155" fill="#829a97" font-family="ui-monospace,monospace" font-size="12">confirmed · responses.create</text>
    </g>
    <g>
      <rect x="500" y="218" width="330" height="104" rx="20" fill="#17151d" stroke="#51466d" stroke-dasharray="5 4"/>
      <circle cx="538" cy="254" r="11" fill="#a986ff" fill-opacity=".14" stroke="#a986ff"/>
      <circle cx="538" cy="254" r="2.5" fill="#a986ff"/>
      <text x="564" y="260" fill="#fff" font-size="19" font-weight="700">Slack</text>
      <text x="538" y="293" fill="#928aa4" font-family="ui-monospace,monospace" font-size="12">possible · package evidence</text>
    </g>
    <g>
      <rect x="500" y="356" width="330" height="104" rx="20" fill="#141c1b" stroke="#2f7772"/>
      <circle cx="538" cy="392" r="11" fill="#3bd8d0" fill-opacity=".16" stroke="#3bd8d0"/>
      <path d="m533 392 3 3 6-7" fill="none" stroke="#3bd8d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="564" y="398" fill="#fff" font-size="19" font-weight="700">Stripe</text>
      <text x="538" y="431" fill="#829a97" font-family="ui-monospace,monospace" font-size="12">confirmed · checkout.sessions.create</text>
    </g>
  </g>
  <text x="40" y="500" fill="#555" font-family="ui-monospace,monospace" font-size="11">develra.lock · deterministic inventory</text>
</svg>
